<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 · Tank Battle</title>
<style>
  :root {
    --bg: #0f1020;
    --panel: #17182b;
    --panel-2: #1f2140;
    --line: #2c2f55;
    --text: #e8e9f5;
    --muted: #8b8fb0;
    --accent: #f1c40f;
    --accent-2: #ffd54a;
    --red: #ff5d5d;
    --green: #4ade80;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: radial-gradient(1200px 700px at 50% -10%, #23254a 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .stage {
    display: flex; gap: 18px; align-items: stretch;
    flex-wrap: wrap; justify-content: center;
  }
  .board {
    position: relative;
    background: #000;
    border: 3px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 12px 50px rgba(0,0,0,0.6), inset 0 0 0 1px #000;
    overflow: hidden;
    line-height: 0;
  }
  canvas { display: block; }

  /* 覆盖层（菜单 / 暂停 / 结束） */
  .overlay {
    position: absolute; inset: 0;
    background: rgba(8, 9, 20, 0.82);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    text-align: center; padding: 24px;
    transition: opacity .15s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay .title {
    font-size: 46px; font-weight: 900; letter-spacing: 4px;
    background: linear-gradient(180deg, #ffe27a, #f1a90f);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 4px 24px rgba(241, 169, 15, 0.35);
  }
  .overlay .subtitle { color: var(--muted); font-size: 14px; margin-top: -6px; }
  .overlay .big {
    font-size: 34px; font-weight: 800; letter-spacing: 2px;
  }
  .overlay .big.win { color: var(--green); }
  .overlay .big.lose { color: var(--red); }
  .overlay p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
  .overlay kbd {
    background: var(--panel-2); border: 1px solid var(--line); border-bottom-width: 2px;
    padding: 1px 7px; border-radius: 5px; font-size: 12px; color: var(--text);
    font-family: inherit;
  }
  button {
    font-family: inherit; cursor: pointer; border: none; border-radius: 8px;
    font-size: 16px; font-weight: 700; padding: 12px 30px; letter-spacing: 2px;
    background: linear-gradient(180deg, #ffd54a, #f1a90f);
    color: #3a2c00; box-shadow: 0 6px 0 #b97f06, 0 10px 22px rgba(241,169,15,.25);
    transition: transform .06s ease, box-shadow .06s ease, filter .15s;
  }
  button:hover { filter: brightness(1.06); }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 #b97f06; }

  /* 侧边信息栏 */
  .hud {
    width: 230px; display: flex; flex-direction: column; gap: 14px;
  }
  .hud h1 {
    margin: 0; font-size: 22px; letter-spacing: 3px;
    background: linear-gradient(180deg, #ffe27a, #f1a90f);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px;
  }
  .stat { display: flex; justify-content: space-between; align-items: baseline; padding: 7px 0; }
  .stat + .stat { border-top: 1px dashed var(--line); }
  .stat .label { color: var(--muted); font-size: 13px; }
  .stat .value { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat .value.accent { color: var(--accent-2); }
  .stat .value.green { color: var(--green); }
  .stat .value.red { color: var(--red); }

  .lives { display: flex; gap: 8px; align-items: center; min-height: 26px; }
  .life {
    width: 24px; height: 24px; border-radius: 5px; position: relative;
    background: #f1c40f; display: inline-block;
  }
  .life::after {
    content: ""; position: absolute; top: 4px; left: 50%; width: 4px; height: 10px;
    background: #5a4700; transform: translateX(-50%);
  }
  .life.dead { background: #3a3d5c; }
  .life.dead::after { background: #20223a; }

  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--muted);
  }
  .pill.on { color: #1a1400; background: var(--accent); border-color: var(--accent); font-weight: 700; }
  .pill.shield { color: #cfe8ff; background: #1d3f63; border-color: #2f6cae; }
  .pill.shield.on { background: #3b82f6; border-color: #93c5fd; color: #fff; }

  .controls { font-size: 12px; color: var(--muted); line-height: 2; }
  .controls b { color: var(--text); font-weight: 600; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row button { flex: 1; padding: 9px 0; font-size: 13px; letter-spacing: 1px; }
  .btn-row button.ghost {
    background: var(--panel-2); color: var(--text); box-shadow: 0 4px 0 #0c0d1c;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="board">
    <canvas id="game" width="624" height="624"></canvas>
    <div id="overlay" class="overlay">
      <div class="title">坦克大战</div>
      <div class="subtitle">TANK BATTLE · 经典致敬</div>
      <button id="startBtn">开始游戏</button>
      <p>
        <kbd>W A S D</kbd> 或 <kbd>方向键</kbd> 移动<br>
        <kbd>空格</kbd> 射击 &nbsp;·&nbsp; <kbd>P</kbd> 暂停
      </p>
    </div>
  </div>

  <aside class="hud">
    <h1>坦克大战</h1>
    <div class="card">
      <div class="stat"><span class="label">得分</span><span id="score" class="value accent">0</span></div>
      <div class="stat"><span class="label">最高分</span><span id="hiscore" class="value">0</span></div>
      <div class="stat"><span class="label">关卡</span><span id="level" class="value green">1</span></div>
      <div class="stat"><span class="label">剩余敌人</span><span id="enemies" class="value red">0</span></div>
    </div>

    <div class="card">
      <div class="stat"><span class="label">生命</span></div>
      <div class="lives" id="lives"></div>
      <div class="pills" style="margin-top:12px">
        <span class="pill" id="pillStar">火力</span>
        <span class="pill shield" id="pillShield">护盾</span>
      </div>
    </div>

    <div class="card controls">
      <b>移动</b>：WASD / 方向键<br>
      <b>射击</b>：空格键<br>
      <b>暂停</b>：P 键<br>
      <b>目标</b>：消灭全部敌人并保护你的基地 🚩
    </div>

    <div class="btn-row">
      <button id="pauseBtn" class="ghost">暂停</button>
      <button id="muteBtn" class="ghost">音效</button>
    </div>
  </aside>
</div>

<script>
(function () {
  "use strict";

  // ================= 常量 =================
  const TILE = 24;
  const COLS = 26, ROWS = 26;
  const W = COLS * TILE, H = ROWS * TILE;   // 624 x 624
  const TANK = 22;        // 坦克碰撞盒边长
  const BULLET = 7;       // 子弹边长

  // 地图元素
  const EMPTY = 0, BRICK = 1, STEEL = 2, WATER = 3, TREE = 4, BASE = 5;

  // 方向: 0上 1右 2下 3左
  const DIR = [
    { dx: 0,  dy: -1, angle: 0 },
    { dx: 1,  dy: 0,  angle: Math.PI / 2 },
    { dx: 0,  dy: 1,  angle: Math.PI },
    { dx: -1, dy: 0,  angle: -Math.PI / 2 },
  ];

  // ================= 地图（左半 13 列，程序镜像成 26 列，保证对称） =================
  const LEFT_MAP = [
    ".............",
    ".............",
    ".##...##.....",
    ".............",
    ".#.#.#.#.#.#.",
    ".............",
    "..@...@...@..",
    ".............",
    "......#......",
    ".....#.#.....",
    "......#......",
    ".............",
    "..%%....%%...",
    "..%%....%%...",
    ".............",
    "..~~....~~...",
    "..~~....~~...",
    ".............",
    ".##..##.##...",
    ".............",
    ".#..#...#..#.",
    ".............",
    "....###......",
    "...........##",
    "...........#E",
    "...........##",
  ];

  function buildMap() {
    const sym = { '.': EMPTY, '#': BRICK, '@': STEEL, '~': WATER, '%': TREE, 'E': BASE };
    return LEFT_MAP.map(function (row) {
      const full = row + row.split('').reverse().join('');
      return full.split('').map(function (ch) { return sym[ch]; });
    });
  }

  // ================= DOM =================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const muteBtn = document.getElementById('muteBtn');
  const elScore = document.getElementById('score');
  const elHiscore = document.getElementById('hiscore');
  const elLevel = document.getElementById('level');
  const elEnemies = document.getElementById('enemies');
  const elLives = document.getElementById('lives');
  const elPillStar = document.getElementById('pillStar');
  const elPillShield = document.getElementById('pillShield');

  // 高分屏适配：保证画面清晰
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // ================= 音效（Web Audio） =================
  let audioCtx = null;
  let muted = false;
  function beep(freq, dur, type, vol) {
    if (muted) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, t);
      osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.6), t + dur);
      g.gain.setValueAtTime(vol || 0.05, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + dur);
    } catch (e) { /* 忽略音频错误 */ }
  }
  const sfx = {
    shoot: function () { beep(880, 0.06, 'square', 0.04); },
    hit:   function () { beep(200, 0.12, 'sawtooth', 0.06); },
    boom:  function () { beep(120, 0.35, 'sawtooth', 0.09); },
    pickup:function () { beep(1200, 0.12, 'triangle', 0.07); },
    start: function () { beep(440, 0.12, 'triangle', 0.06); setTimeout(function(){ beep(660, 0.14, 'triangle', 0.06); }, 120); },
    base:  function () { beep(90, 0.6, 'sawtooth', 0.12); },
  };

  // ================= 游戏状态 =================
  const STATE = { MENU: 0, PLAYING: 1, PAUSED: 2, LEVEL_CLEAR: 3, GAME_OVER: 4, WIN: 5 };
  let state = STATE.MENU;

  let map, player, enemies, bullets, particles, powerups;
  let score, lives, level, hiScore, spawnQueue, spawnTimer, levelClearTimer, gameOverTimer;

  const ENEMY_COLORS = ['#ef4444', '#f97316', '#a855f7', '#14b8a6', '#e11d48'];

  hiScore = parseInt(localStorage.getItem('tank-hiscore') || '0', 10) || 0;
  elHiscore.textContent = hiScore;

  // ================= 工具 =================
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function tileAt(px, py) {
    const c = Math.floor(px / TILE), r = Math.floor(py / TILE);
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return -1;
    return map[r][c];
  }

  // 坦克碰撞检测：撞到墙（砖/钢/水/基地）或边界
  function rectBlockedForTank(x, y, w, h) {
    if (x < 0 || y < 0 || x + w > W || y + h > H) return true;
    const c0 = Math.floor(x / TILE), c1 = Math.floor((x + w - 1) / TILE);
    const r0 = Math.floor(y / TILE), r1 = Math.floor((y + h - 1) / TILE);
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        const t = map[r][c];
        if (t === BRICK || t === STEEL || t === WATER || t === BASE) return true;
      }
    }
    return false;
  }

  // ================= 实体 =================
  function makeTank(x, y, dir, speed, color, isPlayer) {
    return {
      x: x, y: y, dir: dir, speed: speed, color: color, isPlayer: !!isPlayer,
      alive: true, shootTimer: 0, turnTimer: 0,
      shield: 0,          // 无敌剩余秒数
      star: 0,            // 火力等级 0-2
    };
  }

  function makeBullet(cx, cy, dir, owner, power, speed) {
    const d = DIR[dir];
    return {
      x: cx - BULLET / 2, y: cy - BULLET / 2, dir: dir, owner: owner,
      power: power || 0, speed: speed,
      dx: d.dx, dy: d.dy, alive: true,
    };
  }

  // ================= 初始化 / 关卡 =================
  function resetGame() {
    score = 0; lives = 3; level = 1;
    startLevel();
    sfx.start();
  }

  function startLevel() {
    map = buildMap();
    enemies = [];
    bullets = [];
    particles = [];
    powerups = [];
    spawnQueue = enemiesPerLevel();
    spawnTimer = 1.2;
    spawnPlayer();
    updateHUD();
  }

  function enemiesPerLevel() { return Math.min(10 + (level - 1) * 2, 20); }
  function maxAlive() { return Math.min(3 + Math.floor((level - 1) / 2), 6); }

  function spawnPlayer() {
    player = makeTank(12 * TILE + (TILE - TANK) / 2, 22 * TILE, 0, 150, '#f1c40f', true);
    player.shield = 2.5;
  }

  function spawnEnemyIfPossible() {
    if (spawnQueue <= 0) return;
    if (enemies.length >= maxAlive()) return;
    const points = [
      { x: 1, y: 1 },
      { x: 12 * TILE + 1, y: 1 },
      { x: 24 * TILE + 1, y: 1 },
    ];
    // 打乱出生点顺序
    for (let i = points.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = points[i]; points[i] = points[j]; points[j] = t;
    }
    for (const p of points) {
      if (rectBlockedForTank(p.x, p.y, TANK, TANK)) continue;
      let occupied = false;
      if (player && player.alive && aabb(p.x, p.y, TANK, TANK, player.x, player.y, TANK, TANK)) occupied = true;
      for (const e of enemies) {
        if (aabb(p.x, p.y, TANK, TANK, e.x, e.y, TANK, TANK)) { occupied = true; break; }
      }
      if (occupied) continue;
      const speed = 58 + level * 7 + Math.random() * 18;
      const color = ENEMY_COLORS[Math.floor(Math.random() * ENEMY_COLORS.length)];
      const e = makeTank(p.x, p.y, 2, speed, color, false);
      e.turnTimer = 0.5 + Math.random() * 1.2;
      e.shootTimer = 0.8 + Math.random() * 1.6;
      enemies.push(e);
      spawnQueue--;
      spawnTimer = 1.4;
      return;
    }
  }

  // ================= 射击 =================
  function fire(tank) {
    const dir = DIR[tank.dir];
    const cx = tank.x + TANK / 2 + dir.dx * (TANK / 2 + 2);
    const cy = tank.y + TANK / 2 + dir.dy * (TANK / 2 + 2);
    const power = tank.isPlayer ? tank.star : 0;
    const speed = tank.isPlayer ? (300 + tank.star * 60) : (180 + level * 6);
    bullets.push(makeBullet(cx, cy, tank.dir, tank.isPlayer ? 'player' : 'enemy', power, speed));
    if (tank.isPlayer) sfx.shoot();
  }

  // ================= 碰撞与销毁 =================
  function destroyTile(c, r, color) {
    map[r][c] = EMPTY;
    spawnBurst(c * TILE + TILE / 2, r * TILE + TILE / 2, color || '#b45309', 6);
  }

  function spawnBurst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 30 + Math.random() * 90;
      particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.4 + Math.random() * 0.3, color: color, size: 2 + Math.random() * 2 });
    }
  }

  function killTank(tank) {
    if (!tank.alive) return;
    tank.alive = false;
    spawnBurst(tank.x + TANK / 2, tank.y + TANK / 2, tank.color, 16);
    sfx.boom();
    if (!tank.isPlayer) {
      score += 100;
      maybeDropPowerup(tank.x + TANK / 2, tank.y + TANK / 2);
      updateHUD();
    }
  }

  function maybeDropPowerup(x, y) {
    if (Math.random() > 0.22) return;
    const types = ['star', 'shield', 'life', 'bomb'];
    const type = types[Math.floor(Math.random() * types.length)];
    powerups.push({ x: x - TILE / 2, y: y - TILE / 2, type: type, life: 12, blink: 0 });
  }

  function applyPowerup(pu) {
    sfx.pickup();
    if (pu.type === 'star') { player.star = Math.min(2, player.star + 1); }
    else if (pu.type === 'shield') { player.shield = Math.max(player.shield, 8); }
    else if (pu.type === 'life') { lives = Math.min(5, lives + 1); }
    else if (pu.type === 'bomb') { enemies.slice().forEach(killTank); }
    updateHUD();
  }

  function destroyBase() {
    // 清除基地瓦片并触发失败
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (map[r][c] === BASE) { map[r][c] = EMPTY; }
      }
    }
    sfx.base();
    spawnBurst(12.5 * TILE, 24.5 * TILE, '#ef4444', 30);
    gameOver();
  }

  function gameOver() {
    state = STATE.GAME_OVER;
    gameOverTimer = 0;
    if (score > hiScore) { hiScore = score; localStorage.setItem('tank-hiscore', String(hiScore)); }
    elHiscore.textContent = hiScore;
    showOverlay('GAME_OVER');
  }

  function playerDied() {
    lives--;
    updateHUD();
    if (lives < 0) { gameOver(); return; }
    player = null;
    // 1 秒后重生
    playerRespawn = 1.0;
  }

  let playerRespawn = 0;

  // ================= 更新 =================
  function update(dt) {
    if (state !== STATE.PLAYING) {
      // 粒子在结束界面继续飘
      updateParticles(dt);
      if (state === STATE.LEVEL_CLEAR) {
        levelClearTimer -= dt;
        if (levelClearTimer <= 0) {
          level++;
          startLevel();
          state = STATE.PLAYING;
          hideOverlay();
        }
      } else if (state === STATE.GAME_OVER || state === STATE.WIN) {
        gameOverTimer += dt;
      }
      return;
    }

    // 玩家重生
    if (playerRespawn > 0) {
      playerRespawn -= dt;
      if (playerRespawn <= 0) { spawnPlayer(); playerRespawn = 0; }
    }

    if (player) {
      updatePlayer(dt);
    }
    updateEnemies(dt);
    updateBullets(dt);
    updatePowerups(dt);
    updateParticles(dt);

    // 敌人生成
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnEnemyIfPossible();
      if (spawnQueue > 0) spawnTimer = 1.4;
    }

    // 关卡通关判定
    if (spawnQueue <= 0 && enemies.length === 0) {
      if (level >= 5) {
        state = STATE.WIN;
        if (score > hiScore) { hiScore = score; localStorage.setItem('tank-hiscore', String(hiScore)); }
        showOverlay('WIN');
      } else {
        state = STATE.LEVEL_CLEAR;
        levelClearTimer = 2.0;
        showOverlay('LEVEL_CLEAR');
      }
    }

    updateHUD();
  }

  function updatePlayer(dt) {
    const p = player;
    if (p.shield > 0) p.shield -= dt;
    if (p.shootTimer > 0) p.shootTimer -= dt;

    // 读取方向
    let dx = 0, dy = 0;
    if (keys.up) { p.dir = 0; dy = -1; }
    else if (keys.down) { p.dir = 2; dy = 1; }
    else if (keys.left) { p.dir = 3; dx = -1; }
    else if (keys.right) { p.dir = 1; dx = 1; }

    if (dx !== 0) {
      const nx = p.x + dx * p.speed * dt;
      if (!rectBlockedForTank(nx, p.y, TANK, TANK) && !tankHitsOthers(nx, p.y, p)) p.x = nx;
    }
    if (dy !== 0) {
      const ny = p.y + dy * p.speed * dt;
      if (!rectBlockedForTank(p.x, ny, TANK, TANK) && !tankHitsOthers(p.x, ny, p)) p.y = ny;
    }

    if (keys.fire && p.shootTimer <= 0) {
      const maxB = p.star >= 2 ? 3 : (p.star >= 1 ? 2 : 1);
      if (countBullets('player') < maxB) { fire(p); p.shootTimer = 0.18; }
    }
  }

  function updateEnemies(dt) {
    for (const e of enemies) {
      if (!e.alive) continue;
      if (e.shield > 0) e.shield -= dt;
      e.turnTimer -= dt;
      e.shootTimer -= dt;

      // 移动；撞墙则换方向
      const d = DIR[e.dir];
      const nx = e.x + d.dx * e.speed * dt;
      const ny = e.y + d.dy * e.speed * dt;
      const blockedX = rectBlockedForTank(nx, e.y, TANK, TANK) || tankHitsOthers(nx, e.y, e);
      const blockedY = rectBlockedForTank(e.x, ny, TANK, TANK) || tankHitsOthers(e.x, ny, e);

      if (d.dx !== 0 && blockedX) { e.dir = pickEnemyDir(); }
      else if (d.dy !== 0 && blockedY) { e.dir = pickEnemyDir(); }
      else {
        if (d.dx !== 0 && !blockedX) e.x = nx;
        if (d.dy !== 0 && !blockedY) e.y = ny;
      }

      // 随机转向
      if (e.turnTimer <= 0) {
        if (Math.random() < 0.5) e.dir = pickEnemyDir();
        e.turnTimer = 0.6 + Math.random() * 1.6;
      }

      // 射击
      if (e.shootTimer <= 0) {
        aimAtPlayer(e);
        if (countBullets('enemy') < 6) fire(e);
        e.shootTimer = 1.1 + Math.random() * 1.8;
      }
    }
    enemies = enemies.filter(function (e) { return e.alive; });
  }

  function pickEnemyDir() { return Math.floor(Math.random() * 4); }

  function aimAtPlayer(e) {
    if (!player || !player.alive) { e.dir = pickEnemyDir(); return; }
    const cx = e.x + TANK / 2, cy = e.y + TANK / 2;
    const px = player.x + TANK / 2, py = player.y + TANK / 2;
    const dx = px - cx, dy = py - cy;
    if (Math.random() < 0.45) {
      e.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
    } else {
      e.dir = pickEnemyDir();
    }
  }

  function tankHitsOthers(x, y, self) {
    if (player && player.alive && player !== self && aabb(x, y, TANK, TANK, player.x, player.y, TANK, TANK)) return true;
    for (const e of enemies) {
      if (e !== self && e.alive && aabb(x, y, TANK, TANK, e.x, e.y, TANK, TANK)) return true;
    }
    return false;
  }

  function countBullets(owner) {
    let n = 0;
    for (const b of bullets) if (b.owner === owner && b.alive) n++;
    return n;
  }

  function updateBullets(dt) {
    for (const b of bullets) {
      if (!b.alive) continue;
      const step = b.speed * dt;
      b.x += b.dx * step;
      b.y += b.dy * step;

      const cx = b.x + BULLET / 2, cy = b.y + BULLET / 2;

      // 出界
      if (cx < 0 || cy < 0 || cx >= W || cy >= H) { b.alive = false; continue; }

      // 命中瓦片
      const tile = tileAt(cx, cy);
      if (tile === BRICK) {
        destroyTile(Math.floor(cx / TILE), Math.floor(cy / TILE), '#b45309');
        b.alive = false; sfx.hit(); continue;
      } else if (tile === STEEL) {
        if (b.power > 0) { destroyTile(Math.floor(cx / TILE), Math.floor(cy / TILE), '#64748b'); }
        b.alive = false; sfx.hit(); continue;
      } else if (tile === BASE) {
        b.alive = false; destroyBase(); continue;
      }

      // 命中坦克
      if (b.owner === 'player') {
        for (const e of enemies) {
          if (e.alive && aabb(b.x, b.y, BULLET, BULLET, e.x, e.y, TANK, TANK)) { b.alive = false; killTank(e); break; }
        }
      } else {
        if (player && player.alive && aabb(b.x, b.y, BULLET, BULLET, player.x, player.y, TANK, TANK)) {
          b.alive = false;
          if (player.shield <= 0) { killTank(player); playerDied(); }
          else sfx.hit();
        }
      }
    }

    // 子弹互撞（经典设定）
    for (let i = 0; i < bullets.length; i++) {
      const a = bullets[i];
      if (!a.alive) continue;
      for (let j = i + 1; j < bullets.length; j++) {
        const b = bullets[j];
        if (!b.alive || a.owner === b.owner) continue;
        if (aabb(a.x, a.y, BULLET, BULLET, b.x, b.y, BULLET, BULLET)) { a.alive = false; b.alive = false; }
      }
    }

    bullets = bullets.filter(function (b) { return b.alive; });
  }

  function updatePowerups(dt) {
    for (const pu of powerups) {
      pu.life -= dt;
      pu.blink += dt;
      if (player && player.alive && pu.life > 0 && aabb(pu.x, pu.y, TILE, TILE, player.x, player.y, TANK, TANK)) {
        applyPowerup(pu);
        pu.life = 0;
      }
    }
    powerups = powerups.filter(function (pu) { return pu.life > 0; });
  }

  function updateParticles(dt) {
    for (const p of particles) {
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.96;
      p.vy *= 0.96;
    }
    particles = particles.filter(function (p) { return p.life > 0; });
  }

  // ================= 渲染 =================
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0b0c18';
    ctx.fillRect(0, 0, W, H);

    // 网格背景
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * TILE, 0); ctx.lineTo(i * TILE, H); ctx.stroke();
    }
    for (let i = 0; i <= ROWS; i++) {
      ctx.beginPath(); ctx.moveTo(0, i * TILE); ctx.lineTo(W, i * TILE); ctx.stroke();
    }

    // 地图
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = map[r][c];
        if (t === EMPTY) continue;
        drawTile(t, c * TILE, r * TILE, r, c);
      }
    }

    // 道具
    drawPowerups();

    // 坦克
    for (const e of enemies) if (e.alive) drawTank(e.x + TANK / 2, e.y + TANK / 2, e.dir, e.color, false);
    if (player && player.alive) drawTank(player.x + TANK / 2, player.y + TANK / 2, player.dir, player.color, true);

    // 子弹
    ctx.fillStyle = '#fff';
    for (const b of bullets) {
      ctx.fillRect(b.x, b.y, BULLET, BULLET);
      ctx.fillStyle = '#fde68a';
      ctx.fillRect(b.x + 1.5, b.y + 1.5, BULLET - 3, BULLET - 3);
      ctx.fillStyle = '#fff';
    }

    // 粒子
    for (const p of particles) {
      ctx.globalAlpha = clamp(p.life / 0.7, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  function drawTile(t, x, y, r, c) {
    if (t === BRICK) {
      ctx.fillStyle = '#b45309';
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#d97706';
      ctx.fillRect(x + 1, y + 1, TILE - 2, TILE - 2);
      ctx.strokeStyle = '#7c3a06';
      ctx.lineWidth = 1;
      // 砖缝
      ctx.beginPath();
      ctx.moveTo(x, y + TILE / 2); ctx.lineTo(x + TILE, y + TILE / 2);
      ctx.moveTo(x + TILE / 2, y); ctx.lineTo(x + TILE / 2, y + TILE / 2);
      ctx.moveTo(x + TILE / 4, y + TILE / 2); ctx.lineTo(x + TILE / 4, y + TILE);
      ctx.moveTo(x + TILE * 3 / 4, y + TILE / 2); ctx.lineTo(x + TILE * 3 / 4, y + TILE);
      ctx.stroke();
    } else if (t === STEEL) {
      ctx.fillStyle = '#94a3b8';
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#cbd5e1';
      ctx.fillRect(x + 1, y + 1, TILE - 2, TILE - 2);
      ctx.fillStyle = '#64748b';
      ctx.fillRect(x + 3, y + 3, TILE - 6, TILE - 6);
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(x + 3, y + 3, TILE - 6, 2);
    } else if (t === WATER) {
      const t0 = performance.now() / 300;
      ctx.fillStyle = '#1d4ed8';
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#3b82f6';
      for (let i = 0; i < 3; i++) {
        const off = ((r + c + i + Math.floor(t0)) % 3) * (TILE / 3);
        ctx.fillRect(x + off, y + i * (TILE / 3) + 1, TILE / 3, TILE / 3 - 2);
      }
    } else if (t === TREE) {
      ctx.fillStyle = '#14532d';
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#15803d';
      ctx.beginPath();
      ctx.arc(x + TILE / 2, y + TILE / 2, TILE * 0.42, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#22c55e';
      ctx.beginPath();
      ctx.arc(x + TILE / 2 - 2, y + TILE / 2 - 2, TILE * 0.18, 0, Math.PI * 2);
      ctx.fill();
    } else if (t === BASE) {
      // 基地旗帜（鹰标占 2x2，这里只画每个格子的一部分，最终拼成旗帜）
      const isLeft = c === 12;
      const isTop = r === 24;
      // 旗杆
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(x + (isLeft ? TILE - 6 : 0), y, 4, TILE);
      // 旗帜
      const flagX = isLeft ? x : x - TILE;
      const flagY = isTop ? y : y - TILE;
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(flagX + TILE - 6, flagY + 2, TILE * 2 - 8, TILE * 0.62);
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 12px "Segoe UI", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('★', flagX + TILE - 1, flagY + TILE * 0.36);
    }
  }

  function drawTank(cx, cy, dir, color, isPlayer) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(DIR[dir].angle);

    const s = TANK;
    // 履带
    ctx.fillStyle = '#1f2937';
    ctx.fillRect(-s / 2, -s / 2, 5, s);
    ctx.fillRect(s / 2 - 5, -s / 2, 5, s);
    // 车体
    ctx.fillStyle = color;
    roundRect(-s / 2 + 3, -s / 2 + 3, s - 6, s - 6, 3);
    ctx.fill();
    // 车体高光
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(-s / 2 + 3, -s / 2 + 3, s - 6, 3);
    // 炮塔
    ctx.fillStyle = isPlayer ? '#b45309' : '#111827';
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.26, 0, Math.PI * 2);
    ctx.fill();
    // 炮管
    ctx.fillStyle = color;
    ctx.fillRect(-2.5, -s / 2 - 6, 5, 9);
    ctx.fillStyle = '#1f2937';
    ctx.fillRect(-2.5, -s / 2 - 6, 5, 2);

    ctx.restore();

    // 护盾光圈
    if (isPlayer && player && player.shield > 0) {
      ctx.strokeStyle = 'rgba(96,165,250,' + (0.5 + 0.4 * Math.sin(performance.now() / 120)) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, s * 0.72, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawPowerups() {
    for (const pu of powerups) {
      if (pu.life < 3 && Math.floor(pu.blink * 4) % 2 === 0) continue; // 快消失时闪烁
      const x = pu.x, y = pu.y;
      let color, glyph;
      if (pu.type === 'star') { color = '#f59e0b'; glyph = '★'; }
      else if (pu.type === 'shield') { color = '#3b82f6'; glyph = '⛨'; }
      else if (pu.type === 'life') { color = '#22c55e'; glyph = '♥'; }
      else { color = '#ef4444'; glyph = '✹'; }

      ctx.fillStyle = '#111827';
      roundRect(x, y, TILE, TILE, 5); ctx.fill();
      ctx.strokeStyle = color; ctx.lineWidth = 2;
      roundRect(x + 1, y + 1, TILE - 2, TILE - 2, 4); ctx.stroke();
      ctx.fillStyle = color;
      ctx.font = 'bold 15px "Segoe UI", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(glyph, x + TILE / 2, y + TILE / 2 + 1);
    }
  }

  // ================= HUD =================
  function updateHUD() {
    elScore.textContent = score;
    elLevel.textContent = level;
    elEnemies.textContent = spawnQueue + enemies.length;

    // 生命图标
    let html = '';
    for (let i = 0; i < Math.max(0, Math.min(lives, 6)); i++) {
      html += '<span class="life"></span>';
    }
    elLives.innerHTML = html || '<span style="color:var(--muted);font-size:13px">无</span>';

    elPillStar.textContent = '火力 ' + '★'.repeat(Math.max(1, player ? player.star + 1 : 1));
    elPillStar.classList.toggle('on', !!(player && player.star > 0));
    elPillShield.textContent = player && player.shield > 0 ? '护盾 ' + Math.ceil(player.shield) + 's' : '护盾';
    elPillShield.classList.toggle('on', !!(player && player.shield > 0));
  }

  // ================= 覆盖层 =================
  function showOverlay(kind) {
    overlay.classList.remove('hidden');
    const title = overlay.querySelector('.title');
    const sub = overlay.querySelector('.subtitle');
    const p = overlay.querySelector('p');
    const btn = startBtn;

    if (kind === 'MENU') {
      title.textContent = '坦克大战';
      title.className = 'title';
      sub.textContent = 'TANK BATTLE · 经典致敬';
      p.innerHTML = '<kbd>W A S D</kbd> 或 <kbd>方向键</kbd> 移动<br><kbd>空格</kbd> 射击 &nbsp;·&nbsp; <kbd>P</kbd> 暂停';
      btn.textContent = '开始游戏';
      btn.style.display = '';
    } else if (kind === 'PAUSED') {
      title.textContent = '已暂停';
      title.className = 'title';
      sub.textContent = '';
      p.textContent = '按 P 或点击按钮继续';
      btn.textContent = '继续游戏';
      btn.style.display = '';
    } else if (kind === 'LEVEL_CLEAR') {
      title.textContent = '第 ' + level + ' 关 通过';
      title.className = 'title';
      sub.textContent = '准备进入第 ' + (level + 1) + ' 关';
      p.innerHTML = '得分 <b style="color:var(--accent-2)">' + score + '</b>';
      btn.style.display = 'none';
    } else if (kind === 'GAME_OVER') {
      title.textContent = '游戏结束';
      title.className = 'title';
      sub.textContent = '基地失守 或 生命耗尽';
      p.innerHTML = '最终得分 <b style="color:var(--accent-2)">' + score + '</b> · 最高 ' + hiScore;
      btn.textContent = '再来一局';
      btn.style.display = '';
    } else if (kind === 'WIN') {
      title.textContent = '🎉 通关！';
      title.className = 'title';
      sub.textContent = '你是一名出色的坦克指挥官';
      p.innerHTML = '最终得分 <b style="color:var(--accent-2)">' + score + '</b> · 最高 ' + hiScore;
      btn.textContent = '重新开始';
      btn.style.display = '';
    }
  }
  function hideOverlay() { overlay.classList.add('hidden'); }

  // ================= 输入 =================
  const keys = { up: false, down: false, left: false, right: false, fire: false };
  const KEYMAP = {
    ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    Space: 'fire',
  };

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
    if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = true;

    if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }

    if (state === STATE.MENU && (e.code === 'Enter' || e.code === 'Space')) { begin(); return; }
    if (state === STATE.GAME_OVER && e.code === 'Enter') { begin(); return; }
    if (state === STATE.WIN && e.code === 'Enter') { begin(); return; }
  });
  window.addEventListener('keyup', function (e) {
    if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false;
  });

  function begin() {
    resetGame();
    state = STATE.PLAYING;
    hideOverlay();
    sfx.start();
  }

  function togglePause() {
    if (state === STATE.PLAYING) { state = STATE.PAUSED; showOverlay('PAUSED'); }
    else if (state === STATE.PAUSED) { state = STATE.PLAYING; hideOverlay(); }
  }

  startBtn.addEventListener('click', function () {
    if (state === STATE.MENU || state === STATE.GAME_OVER || state === STATE.WIN) begin();
    else if (state === STATE.PAUSED) { state = STATE.PLAYING; hideOverlay(); }
  });
  pauseBtn.addEventListener('click', togglePause);
  muteBtn.addEventListener('click', function () {
    muted = !muted;
    muteBtn.textContent = muted ? '已静音' : '音效';
  });

  // ================= 主循环 =================
  let last = performance.now();
  function loop(now) {
    const dt = clamp((now - last) / 1000, 0, 0.05);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // 初始状态
  state = STATE.MENU;
  map = buildMap();
  enemies = []; bullets = []; particles = []; powerups = [];
  spawnQueue = 0; player = null; score = 0; lives = 3; level = 1;
  showOverlay('MENU');
  updateHUD();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
